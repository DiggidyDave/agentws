[project]
name = "agentws"
version = "0.1.0"
description = "Create and manage multi-repo agentic workspaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "tomlkit>=0.12",
  "requests>=2.31",
]

[project.scripts]
agentws = "agentws:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agentws"]
